[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justkitten"]

[project]
name = "justkitten"
version = "0.8.0"
description = "Utilities for the Justin project"
readme = "README.md"
license = "MIT"
authors = [{ name = "Igor Djachenko" }]
requires-python = ">=3.11"
dependencies = [
    "justkitten[util]",
    "justkitten[joins]",
    "justkitten[singleton]",
    "justkitten[pylinq]",
    "justkitten[other]",
    "justkitten[filesystem]",
    "justkitten[cli]",
    "justkitten[parts]",
    "justkitten[exif]",
    "justkitten[sources]",
]

[project.scripts]
parts = "justkitten.parts:__run"
sf = "justkitten.subfolder:__run"

[project.optional-dependencies]
util       = []
joins      = []
singleton  = []
pylinq     = []
other      = [
    "justkitten[singleton]",
    "typing_extensions; python_version < '3.13'",
]
filesystem = [
    "justkitten[other]",
    "typing_extensions; python_version < '3.13'",
]
cli        = [
    "justkitten[util]",
    "typer",
]
parts      = [
    "justkitten[cli]",
]
exif       = [
    "Pillow",
]
sources    = [
    "justkitten[util]",
    "justkitten[joins]",
    "justkitten[exif]",
    "justkitten[filesystem]",
]
testing    = [
    "pytest",
]
test       = [
    "pytest",
    "ruff >= 0.16, < 0.17",
    "mypy",
]
release    = [
    "build",
    "python-semantic-release",
]

[project.urls]
Homepage   = "https://github.com/djachenko/justkitten-py"
Repository = "https://github.com/djachenko/justkitten-py"
Issues     = "https://github.com/djachenko/justkitten-py/issues"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "COM",  # trailing commas
    "DTZ",  # naive datetime
    "BLE",  # blind except
    "ANN",  # annotations
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # Any is the honest annotation for type introspection and decorators
    "C416",    # explicit comprehension reads better than a dict() cast
    "C420",    # explicit comprehension reads better than dict.fromkeys
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "justkitten.cli",
]
ignore_errors = true

[tool.semantic_release]
version_toml    = ["pyproject.toml:project.version"]
branch          = "master"
commit_message  = "chore(release): v{version} [no ci]"
major_on_zero   = false
allow_zero_version = true
